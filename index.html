<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Strength Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">

    <div class="text-center space-y-1">
      <div class="inline-flex p-3 rounded-xl bg-cyan-500/10 text-cyan-400 mb-2">
        <i class="fa-solid fa-shield-halved text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Password Strength Analyzer</h1>
      <p class="text-xs text-slate-400">7-Stage Modular Security Pipeline</p>
    </div>

    <div class="relative">
      <input type="password" id="pwdInput" placeholder="Enter password to evaluate..."
        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 pr-12 text-sm focus:outline-none focus:border-cyan-500 transition-colors" />
      <button id="toggleBtn" type="button" class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-200">
        <i class="fa-regular fa-eye" id="toggleIcon"></i>
      </button>
    </div>

    <div class="space-y-2">
      <div class="flex justify-between items-center text-sm font-medium">
        <span>Security Score: <strong id="scoreVal" class="text-cyan-400">0</strong>/100</span>
        <span id="badge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-400">Enter Password</span>
      </div>
      <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
        <div id="meter" class="h-full w-0 transition-all duration-300 bg-red-500"></div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 text-xs">
      <div id="chk-len" class="flex items-center gap-2 text-slate-400"><i class="fa-solid fa-circle-xmark text-red-500"></i> 8+ Characters</div>
      <div id="chk-upper" class="flex items-center gap-2 text-slate-400"><i class="fa-solid fa-circle-xmark text-red-500"></i> Uppercase (A-Z)</div>
      <div id="chk-lower" class="flex items-center gap-2 text-slate-400"><i class="fa-solid fa-circle-xmark text-red-500"></i> Lowercase (a-z)</div>
      <div id="chk-num" class="flex items-center gap-2 text-slate-400"><i class="fa-solid fa-circle-xmark text-red-500"></i> Number (0-9)</div>
      <div id="chk-sym" class="flex items-center gap-2 text-slate-400"><i class="fa-solid fa-circle-xmark text-red-500"></i> Symbol (!@#$)</div>
      <div id="chk-pat" class="flex items-center gap-2 text-slate-400"><i class="fa-solid fa-circle-xmark text-red-500"></i> No Common Words</div>
    </div>

    <div id="suggestionBox" class="p-3.5 bg-slate-950/60 border border-slate-800 rounded-xl text-xs space-y-1">
      <p class="font-semibold text-slate-300">Recommendations:</p>
      <ul id="suggestionsList" class="list-disc list-inside text-slate-400 space-y-1">
        <li>Type a password above to begin analysis.</li>
      </ul>
    </div>
  </div>

  <script>
    const input = document.getElementById('pwdInput');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleIcon = document.getElementById('toggleIcon');
    const scoreVal = document.getElementById('scoreVal');
    const badge = document.getElementById('badge');
    const meter = document.getElementById('meter');
    const suggestionsList = document.getElementById('suggestionsList');

    const commonPatterns = ['password', '123456', 'qwerty', 'admin', 'welcome', 'letmein'];

    toggleBtn.addEventListener('click', () => {
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      toggleIcon.className = isPwd ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    });

    input.addEventListener('input', () => {
      const val = input.value;
      if (!val) {
        resetUI();
        return;
      }

      let score = 0;
      let suggestions = [];

      const hasLen = val.length >= 8;
      const hasUpper = /[A-Z]/.test(val);
      const hasLower = /[a-z]/.test(val);
      const hasNum = /[0-9]/.test(val);
      const hasSym = /[^A-Za-z0-9]/.test(val);

      const lower = val.toLowerCase();
      const hasCommon = commonPatterns.some(p => lower.includes(p));
      const hasRepeat = /(.)\1{2,}/.test(val);

      if (val.length >= 8) score += 20;
      if (val.length >= 12) score += 15;
      if (hasUpper) score += 15;
      if (hasLower) score += 15;
      if (hasNum) score += 15;
      if (hasSym) score += 20;

      if (hasCommon) score = Math.max(10, score - 30);
      if (hasRepeat) score = Math.max(10, score - 15);

      updateCheck('chk-len', hasLen);
      updateCheck('chk-upper', hasUpper);
      updateCheck('chk-lower', hasLower);
      updateCheck('chk-num', hasNum);
      updateCheck('chk-sym', hasSym);
      updateCheck('chk-pat', !hasCommon && !hasRepeat);

      if (val.length < 12) suggestions.push('Increase length to 12+ characters for brute-force resistance.');
      if (!hasUpper) suggestions.push('Add capital letters (A–Z).');
      if (!hasLower) suggestions.push('Add lowercase letters (a–z).');
      if (!hasNum) suggestions.push('Incorporate numeric digits (0–9).');
      if (!hasSym) suggestions.push('Include special symbols (!, @, #, $, %).');
      if (hasCommon) suggestions.push('Avoid obvious dictionary terms like "admin" or "password".');
      if (hasRepeat) suggestions.push('Eliminate repeated character strings (e.g., "aaa").');

      scoreVal.innerText = score;
      meter.style.width = score + '%';

      if (score < 40) {
        meter.className = 'h-full transition-all duration-300 bg-red-500';
        setBadge('Weak', 'bg-red-500/10 text-red-400 border border-red-500/20');
      } else if (score < 60) {
        meter.className = 'h-full transition-all duration-300 bg-amber-500';
        setBadge('Moderate', 'bg-amber-500/10 text-amber-400 border border-amber-500/20');
      } else if (score < 80) {
        meter.className = 'h-full transition-all duration-300 bg-blue-500';
        setBadge('Strong', 'bg-blue-500/10 text-blue-400 border border-blue-500/20');
      } else {
        meter.className = 'h-full transition-all duration-300 bg-emerald-500';
        setBadge('Very Strong', 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20');
      }

      suggestionsList.innerHTML = suggestions.length 
        ? suggestions.map(s => `<li>${s}</li>`).join('') 
        : '<li class="text-emerald-400">Excellent password! No further action needed.</li>';
    });

    function updateCheck(id, ok) {
      const el = document.getElementById(id);
      el.children[0].className = ok
        ? 'fa-solid fa-circle-check text-emerald-500'
        : 'fa-solid fa-circle-xmark text-red-500';
    }

    function setBadge(text, classes) {
      badge.innerText = text;
      badge.className = `px-2.5 py-0.5 rounded-full text-xs font-semibold ${classes}`;
    }

    function resetUI() {
      scoreVal.innerText = '0';
      meter.style.width = '0%';
      meter.className = 'h-full w-0 transition-all duration-300 bg-red-500';
      setBadge('Enter Password', 'bg-slate-800 text-slate-400');
      ['chk-len','chk-upper','chk-lower','chk-num','chk-sym','chk-pat'].forEach(id => updateCheck(id, false));
      suggestionsList.innerHTML = '<li>Type a password above to begin analysis.</li>';
    }
  </script>
</body>
</html>
